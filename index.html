<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nour Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header >
        <nav class="bg-[#05096B] h-15 flex items-center justify-between ">
            <div class="flex items-center text-white">
                <img class="w-18 px-4 mx-auto" src="images/noor_academy_2026.webp" alt="logo">
                <a class="" href="index.html">Nour Academy</a>
            </div>
            <ul class="p-2">
                <button class="bg-[#FCCA46] text-black rounded-4xl mx-auto w-20 h-9 text-[10px]">Mon panier  (0)</button>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <div class="bg-[url('/images/banner_sans_texte.webp')] bg-cover bg-center bg-no-repeat h-55 w-132 md:h-150 md:w-384">
                <p class="px-6 pt-12 text-[#FCCA46] text-[7px] md:px-18 md:pt-28 md:text-[32px]">VOTRE RÉUSSITE, NOTRE PRIORITÉ</p>
                <h1 class="px-6 w-70 font-bold text-[20px] text-white md:px-18 md:text-[55px] md:w-200">Construisez votre avenir avec <span class="text-[#FCCA46]">Nour Academy</span>.</h1>
                <p class="px-6 pb-3 font-semibold text-[8px] text-white md:px-18 md:text-[23px] md:pb-6">Un accompagnement scolaire adapté du primaire au Bac.</p>
                <button class="px-6 rounded-full h-7 w-38 mx-8 font-normal text-[10px] text-black bg-[#FCCA46] md:px-20 md:p-0 md:mx-25 md:w-92 md:h-10 md:text-[20px]">S’inscrire maintenant →</button>
            </div>
        </section>
        <section class="bg-[#0B2C57] h-screen">
            <h1 class="px-40 w-[551px] text-center pt-5 font-bold text-[20px] text-[#FCCA46] md:px-120 md:pt-13 md:text-[55px] md:w-full">Nos niveaux scolaires</h1>
            <div class="flex px-13 gap-15 pb-5 bg-white pt-5 text-black font-semibold text-[14px] rounded-b-4xl border mx-auto ">
                <select class="bg-[#D9D9D9] pt-3 pb-3 rounded-2xl " name="text" id="">
                    <option class="hidden" value="text">Sélection des niveaux</option>
                    <option value="">Primaire</option>
                    <option value="">Collège</option>
                    <option value="">Lycée</option>
                </select>
                <select class="bg-[#D9D9D9] pt-3 pb-3 rounded-2xl " name="text" id="">
                    <option class="hidden" value="text">Choix des matériaux</option>
                    <option value="text">Mathématiques</option>
                    <option value="text">Français</option>
                    <option value="text">Physique-Chimie</option>
                    <option value="text">Arabe</option>
                    <option value="text">SVT</option>
                    <option value="text">Anglais</option>
                    <option value="text">Préparation Bac Maths</option>
                    <option value="text">Préparation Bac Physique</option>
                    <option value="text">Sciences naturelles</option>
                    <option value="text">Anglais — Conversation</option>
                    <option value="text">Révisions intensives</option>
                    <option value="text">Lecture et expression</option>
                    <option value="text">Histoire-Géographie</option>
                    <option value="text">Économie et Comptabilité</option>
                </select>
            </div>
            <div>
                
            </div>
        </section>

    </main>




    <script type="module" src="/script.js"></script>
</body>
</html>
